name: Documented lmipro DT panic-region kernel
on:
  push:
    branches: [kernel-lmi-dt-panic-20261030]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned sources
        run: |
          mkdir unixnu && cd unixnu
          git init -q
          git remote add origin https://github.com/yang232138/UniXNU.git
          git fetch -q --depth 1 origin ee472385743ebd16941ab14892dcb9d02e219d15
          git checkout -q FETCH_HEAD
          cd ..
          mkdir lmipro && cd lmipro
          git init -q
          git remote add origin https://github.com/yang232138/lmipro.git
          git fetch -q --depth 1 origin 46df25155308279c56ec5098ea7d36ee7e43a7c3
          git checkout -q FETCH_HEAD
          cd ..
          mkdir uefi && cd uefi
          git init -q
          git remote add origin https://github.com/Project-Silicium/Mu-Silicium.git
          git fetch -q --depth 1 origin e51cd877e31c8fbb322032dc4cb6715e83d25ad3
          git checkout -q FETCH_HEAD
          cd ..
          cp -a overlay/BootShim/. uefi/BootShim/
          cp -a overlay/Resources/. uefi/Resources/
      - name: Install tools used by the successful baseline
        run: |
          brew install llvm lld mtools dtc unifdef
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          df -h "$GITHUB_WORKSPACE"
      - name: Download the current verified firmware
        uses: actions/download-artifact@v4
        with:
          name: lmi-mmu-helper-payload
          run-id: 40877381481
          github-token: ${{ github.token }}
          path: current-firmware
      - name: Check firmware identity and prepare the fixed configuration
        run: |
          python3 -c 'import pathlib,hashlib; p=pathlib.Path("current-firmware/SILICIUM_UEFI.fd"); assert p.stat().st_size==0x300000; assert hashlib.sha256(p.read_bytes()).hexdigest()=="720481eb15e6cb3a6552c717ee6e912649a9c81eef18c95ab00dff7627530ee6"'
          python3 overlay/scripts/adapt.py --unixnu unixnu
          cd unixnu
          ./unixnu defconfig lmipro_defconfig -D ../lmipro
          ./unixnu fetch -D ../lmipro
          ./unixnu status -D ../lmipro
          ./unixnu status --json -D ../lmipro > ../resolved-status.json
      - name: Build the kernel with the documented DT panic region option
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd unixnu
          ./unixnu build kernel -D ../lmipro
      - name: Verify the new compiled panic-region path
        run: |
          python3 overlay/scripts/verify_dt_panic_kernel.py --work unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro --out output
          cp resolved-status.json output/
          cp lmipro/porting.toml output/
      - name: Add only the documented post-console return checkpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lmipro/board.toml')
          s=p.read_text()
          assert s.count('[payload]\n')==1 and 'panic_screen' not in s
          s=s.replace('[payload]\n','[payload]\npanic_screen = false\nentry_probe_reset_delay = 6\nentry_probe_reset_after = "_PE_create_console"\nentry_probe_reset_in = "_arm_init"\nentry_probe_reset_occurrence = 1\n',1)
          p.write_text(s)
          PY
          cd unixnu
          ./unixnu build payload -D ../lmipro --uefi ../uefi --unique-chip-id 0x8011
      - name: Pack the current firmware with the new kernel payload
        run: |
          payload=$(find unixnu/out -path '*/payload/payload.img' | head -1)
          report=$(find unixnu/out -path '*/payload/payload.json' | head -1)
          log=$(find unixnu/out -path '*/logs/payload-patch.log' | head -1)
          test -n "$payload" && test -n "$report" && test -n "$log"
          python3 overlay/scripts/pack_bootimg.py --uefi uefi --fd current-firmware/SILICIUM_UEFI.fd --payload "$payload" --dtb overlay/DeviceTree/lmi.dtb --payload-base 0x93200000 --out output/boot.img
          cp current-firmware/SILICIUM_UEFI.fd output/
          cp "$report" output/
          cp "$log" output/
          cp lmipro/board.toml output/test-board.toml
          cd output && shasum -a 256 boot.img kernel-original.macho SILICIUM_UEFI.fd > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lmipro-dt-panic-kernel
          path: |
            output/
            resolved-status.json
            unixnu/out/**/logs/*.log
          if-no-files-found: warn
          retention-days: 3
