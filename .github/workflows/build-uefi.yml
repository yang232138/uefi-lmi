name: build-uefi

# Builds the lmi (Redmi K30 Pro, SM8250) Mu-Silicium firmware volume with the
# UniXNU, DarwinBoot and payload-filesystem modules from
# https://unixnu.com/zh/porting/uefi-firmware, then packs it into a boot image
# that can be run with "fastboot boot" without flashing.
#
# Inputs that live in the firmware tree are staged from this repository:
#   Platforms/Xiaomi/lmiPkg  board DSC/FDF, APRIORI/DXE/RAW includes, libraries
#   BootShim/BootShim.S      shim that copies the FD to its load address
#   Resources/Configs/lmi.toml  FD base/size and boot image header values
#   Binaries-lmi.zip         vendor DXE set extracted from the handset's XBL
#   DeviceTree/lmi.dtb       compiled device tree of the handset

on:
  workflow_dispatch:
    inputs:
      unixnu_repo:
        description: UniXNU repository (owner/name)
        required: true
        default: yang232138/UniXNU
      unixnu_ref:
        description: UniXNU ref
        required: true
        default: main
      device_repo:
        description: Device repository (owner/name)
        required: true
        default: yang232138/lmipro
      device_ref:
        description: Device repository ref
        required: true
        default: main
      mu_commit:
        description: Mu-Silicium commit to build against
        required: true
        default: e51cd877e31c8fbb322032dc4cb6715e83d25ad3
      unique_chip_id:
        description: Platform seed for the payload (board.toml marks it required)
        required: false
        default: "0x8011"
      skip_userdata:
        description: Skip the userdata root image job (it is unchanged after the first flash)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  firmware:
    # EDK II builds with clang + lld on Linux. The kernel step needs macOS, so
    # this job stops at the firmware volume and the boot image.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UNIXNU_REPO: ${{ inputs.unixnu_repo }}
      UNIXNU_REF: ${{ inputs.unixnu_ref }}
      DEVICE_REPO: ${{ inputs.device_repo }}
      DEVICE_REF: ${{ inputs.device_ref }}
      MU_COMMIT: ${{ inputs.mu_commit }}
    steps:
      - name: Check out this overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Check out UniXNU
        run: git clone --depth 1 --branch "$UNIXNU_REF" "https://github.com/$UNIXNU_REPO" unixnu

      - name: Check out the device repository
        run: git clone --depth 1 --branch "$DEVICE_REF" "https://github.com/$DEVICE_REPO" lmipro

      - name: Fetch Mu-Silicium at the pinned commit
        run: |
          mkdir uefi && cd uefi
          git init -q
          git remote add origin https://github.com/Project-Silicium/Mu-Silicium.git
          git fetch -q --depth 1 origin "$MU_COMMIT"
          git checkout -q FETCH_HEAD
          # The shared EDK II tree and Mu packages. Binaries is skipped on purpose:
          # the board vendor DXE set comes from this repository instead.
          git submodule update --init --depth 1 \
            Mu_Basecore Common/Mu Common/Mu_OEM_Sample Silicium-ACPI || true
          test -d Mu_Basecore/BaseTools || { echo 'Mu_Basecore is not checked out'; exit 1; }

      - name: Install the host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm nasm uuid-dev python3 make \
            acpica-tools device-tree-compiler unzip
          clang --version | head -1
          python3 --version

      - name: Stage the board overlay and the vendor DXE set
        run: |
          cp -a overlay/Platforms/. uefi/Platforms/
          cp -a overlay/BootShim/. uefi/BootShim/
          cp -a overlay/Resources/. uefi/Resources/
          rm -rf uefi/Binaries/lmi
          mkdir -p uefi/Binaries/lmi
          unzip -q overlay/Binaries-lmi.zip -d uefi/Binaries/lmi
          test -f uefi/Platforms/Xiaomi/lmiPkg/lmi.dsc
          test -f uefi/Binaries/lmi/QcomPkg/Drivers/ButtonsDxe/ButtonsDxe.inf
          echo "vendor DXE files: $(find uefi/Binaries/lmi -type f | wc -l)"

      - name: Adapt the pinned upstreams
        # bootimg's image_size check, and the SEC entry-argument handoff that
        # Project-Silicium v4.0 drops: without it the DAEE82E6 HOB is never
        # built, UniXNURamDiskDxe never publishes the payload volume, and the
        # menu has no xnu entry. String edits instead of a patch file so the
        # checkout's line endings do not matter.
        run: python3 overlay/scripts/adapt.py --unixnu unixnu --uefi uefi

      - name: Resolve the device configuration
        run: |
          cd unixnu
          ./unixnu defconfig lmipro_defconfig -D ../lmipro
          ./unixnu fetch -D ../lmipro
          ./unixnu status -D ../lmipro

      - name: Build the firmware volume
        run: |
          cd unixnu
          ./unixnu build firmware -D ../lmipro --uefi ../uefi
          fd=$(find ../uefi/Build/lmiPkg -path '*FV/SILICIUM_UEFI.fd' | head -1)
          test -n "$fd" || { echo 'no firmware volume produced'; exit 1; }
          echo "firmware volume: $fd ($(stat -c %s "$fd") bytes)"

      - name: Pack the boot image
        run: |
          cd unixnu
          fd=$(find ../uefi/Build/lmiPkg -path '*FV/SILICIUM_UEFI.fd' | head -1)
          ./unixnu bootimg -D ../lmipro --uefi ../uefi --fd "$fd" --dtb ../overlay/DeviceTree/lmi.dtb
          echo '--- boot.json ---'
          cat out/lmipro/*/*/boot/boot.json

      - name: Upload the firmware volume and the boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmi-uefi
          path: |
            uefi/Build/lmiPkg/**/FV/*.fd
            unixnu/out/**/boot/boot.img
            unixnu/out/**/boot/boot.json
            unixnu/out/**/logs/*.log
          if-no-files-found: warn
          retention-days: 14

  payload:
    # The XNU kernel step drives Xcode, so it runs on Apple's runner; the firmware
    # volume comes from the job above instead of being rebuilt here.
    needs: firmware
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_REPO: ${{ inputs.unixnu_repo }}
      UNIXNU_REF: ${{ inputs.unixnu_ref }}
      DEVICE_REPO: ${{ inputs.device_repo }}
      DEVICE_REF: ${{ inputs.device_ref }}
      MU_COMMIT: ${{ inputs.mu_commit }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out this overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Check out UniXNU
        run: git clone --depth 1 --branch "$UNIXNU_REF" "https://github.com/$UNIXNU_REPO" unixnu

      - name: Check out the device repository
        run: git clone --depth 1 --branch "$DEVICE_REF" "https://github.com/$DEVICE_REPO" lmipro

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the host tools
        run: |
          brew install llvm lld mtools dtc unifdef
          # Homebrew LLVM is keg-only; bootimg needs llvm-objcopy and llvm-nm by name.
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Report the runner toolchain
        run: |
          xcodebuild -version
          df -h "$GITHUB_WORKSPACE"

      - name: Download the firmware volume
        uses: actions/download-artifact@v4
        with:
          name: lmi-uefi
          path: artifact

      - name: Fetch Mu-Silicium for the boot image tools
        run: |
          mkdir uefi && cd uefi
          git init -q
          git remote add origin https://github.com/Project-Silicium/Mu-Silicium.git
          git fetch -q --depth 1 origin "$MU_COMMIT"
          git checkout -q FETCH_HEAD
          cd ..
          cp -a overlay/BootShim/. uefi/BootShim/
          cp -a overlay/Resources/. uefi/Resources/
          test -f uefi/Resources/Scripts/mkbootimg.py

      - name: Adapt the pinned upstreams
        run: python3 overlay/scripts/adapt.py --unixnu unixnu

      - name: Resolve the device configuration
        run: |
          cd unixnu
          ./unixnu defconfig lmipro_defconfig -D ../lmipro
          # The kernel patch series references kits/XnuPrelink, which only exists
          # after the feeds and submodules are fetched.
          ./unixnu fetch -D ../lmipro
          ./unixnu status -D ../lmipro

      - name: Restore the built kernel
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: unixnu/out/lmipro/*/lmipro/kernel
          # Keyed on the upstreams only: kernel_args and panic_screen live in
          # board.toml and change the payload, not the kernel, so a tweak there
          # must not force a rebuild.
          key: lmi-kernel-${{ inputs.unixnu_ref }}-${{ inputs.device_ref }}-${{ inputs.unique_chip_id }}

      - name: Build the kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          # The Apple source listing goes through the GitHub API and anonymous
          # calls from hosted runners hit the shared rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd unixnu
          ./unixnu build kernel -D ../lmipro

      - name: Build the trust cache bundle
        run: |
          cd unixnu
          # Extract the two modules the payload trust cache carries. The board has
          # no [ipsw] fetch list, so name them explicitly.
          ./unixnu ipsw fetch -D ../lmipro StaticTrustCache "Cryptex1,SystemTrustCache"
          find out -type f | grep -i trust || true
          static=$(find out -type f | grep -i 'static.*trust' | head -1)
          system=$(find out -type f | grep -i 'system.*trust' | head -1)
          echo "static: $static"
          echo "system: $system"
          test -n "$static" && test -n "$system"
          python3 overlay/scripts/build-trust-bundle.py \
            --static "$static" \
            --system "$system" \
            --output trust.bundle \
            --report trust.json
          cat trust.json

      - name: Build the payload
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
        run: |
          cd unixnu
          # panic_screen needs FrameBufferSerialPortLib/Font.h from Mu-Silicium.
          ./unixnu build payload -D ../lmipro \
            --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID" \
            --uefi ../uefi \
            --trust-cache trust.bundle

      - name: Pack the boot image with the payload in the kernel
        # lmi's boot loader ignores the boot image's own ramdisk (like the 3a in
        # UniXNU's asteroids record), so the payload rides after the firmware
        # volume as an XNUP block that BootShim copies to 0x93200000, and the
        # ramdisk field stays empty.
        run: |
          fd=$(find artifact -name 'SILICIUM_UEFI.fd' | head -1)
          test -n "$fd" || { echo 'the firmware artifact is missing the FD'; exit 1; }
          payload=$(find unixnu/out -name 'payload.img' | head -1)
          test -n "$payload" || { echo 'no payload volume produced'; exit 1; }
          out=unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro/boot/boot.img
          python3 overlay/scripts/pack_bootimg.py \
            --uefi uefi \
            --fd "$fd" \
            --payload "$payload" \
            --dtb overlay/DeviceTree/lmi.dtb \
            --payload-base 0x93200000 \
            --out "$out"
          ls -l "$out"

      - name: Upload the boot image with the payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmi-boot-payload
          path: |
            unixnu/out/**/boot/boot.img
            unixnu/out/**/payload/payload.json
          if-no-files-found: warn
          # Short retention: the payload carries kernel material derived from an
          # Apple restore image. Keep it private if that matters to you.
          retention-days: 3

  userdata:
    # Builds the XNU root volume from the OS profile's IPSW. hdiutil is macOS
    # only, and the extracted components plus the written image need roughly
    # 20 GB, so the IPSW cache is dropped as soon as the image exists.
    # Skipped from the dispatch inputs once the image has been flashed: it does
    # not change when only the firmware or the payload does.
    if: ${{ !inputs.skip_userdata }}
    needs: firmware
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_REPO: ${{ inputs.unixnu_repo }}
      UNIXNU_REF: ${{ inputs.unixnu_ref }}
      DEVICE_REPO: ${{ inputs.device_repo }}
      DEVICE_REF: ${{ inputs.device_ref }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out this overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Check out UniXNU
        run: git clone --depth 1 --branch "$UNIXNU_REF" "https://github.com/$UNIXNU_REPO" unixnu

      - name: Check out the device repository
        run: git clone --depth 1 --branch "$DEVICE_REF" "https://github.com/$DEVICE_REPO" lmipro

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Report the runner disk and the partition geometry
        run: |
          df -h "$GITHUB_WORKSPACE"
          grep -E 'first_lba|last_lba|lba_bytes' lmipro/board.toml

      - name: Adapt the pinned upstreams
        run: python3 overlay/scripts/adapt.py --unixnu unixnu

      - name: Resolve the device configuration
        run: |
          cd unixnu
          ./unixnu defconfig lmipro_defconfig -D ../lmipro
          ./unixnu fetch -D ../lmipro

      - name: Build the userdata root image
        run: |
          cd unixnu
          ./unixnu build userdata -D ../lmipro
          df -h "$GITHUB_WORKSPACE"
          ls -lh out/lmipro/*/*/userdata/ || true
          cat out/lmipro/*/*/userdata/userdata-root.json || true

      - name: Free the IPSW cache
        if: always()
        run: rm -rf unixnu/out/ipsw || true

      - name: Compress the image for upload
        if: success()
        run: |
          img=$(find unixnu/out -name 'userdata-root.img' | head -1)
          test -n "$img" || { echo 'no userdata image produced'; exit 1; }
          ls -lh "$img"
          # The image is mostly zero bytes; level 1 is fast and stays small.
          gzip -1 "$img"
          ls -lh "$img.gz"
          df -h "$GITHUB_WORKSPACE"

      - name: Upload the root image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmi-userdata-root
          path: |
            unixnu/out/**/userdata/userdata-root.img.gz
            unixnu/out/**/userdata/userdata-root.json
          if-no-files-found: warn
          retention-days: 3
