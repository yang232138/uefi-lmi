name: LMIPRO original watchdog client with board deadline backend
'on':
  push:
    branches:
    - codex/lmipro-system-watchdog-20261112
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      UNIXNU_REPO: yang232138/UniXNU
      UNIXNU_REF: bbde4a06d695cb5191735a14b1eaad0aca4883a3
      DEVICE_REPO: yang232138/lmipro
      DEVICE_REF: 3c6d4407bde5c154d462591289e21667c464c4e5
      MU_COMMIT: e51cd877e31c8fbb322032dc4cb6715e83d25ad3
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Check out this overlay
      uses: actions/checkout@v4
      with:
        path: overlay
    - name: Check out UniXNU
      run: 'mkdir unixnu

        git -C unixnu init -q

        git -C unixnu remote add origin "https://github.com/$UNIXNU_REPO"

        git -C unixnu fetch -q --depth 1 origin "$UNIXNU_REF"

        git -C unixnu checkout -q FETCH_HEAD

        '
    - name: Check out the device repository
      run: 'mkdir lmipro

        git -C lmipro init -q

        git -C lmipro remote add origin "https://github.com/$DEVICE_REPO"

        git -C lmipro fetch -q --depth 1 origin "$DEVICE_REF"

        git -C lmipro checkout -q FETCH_HEAD

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install the host tools
      run: 'brew install llvm lld mtools dtc unifdef

        # Homebrew LLVM is keg-only; bootimg needs llvm-objcopy and llvm-nm by name.

        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

        '
    - name: Report the runner toolchain
      run: 'xcodebuild -version

        df -h "$GITHUB_WORKSPACE"

        '
    - name: Restore the exact qualified firmware input
      run: 'python3 - <<''PY''

        from pathlib import Path

        import gzip,hashlib

        p=Path(''artifact'');p.mkdir()

        b=gzip.decompress(Path(''overlay/diagnostics/qualified-SILICIUM_UEFI.fd.gz'').read_bytes())

        assert len(b)==0x300000

        assert hashlib.sha256(b).hexdigest()==''f95578af73b83c818ab07dc2210e0a435cbb4c9a9a962de3405d5da05921624b''

        (p/''SILICIUM_UEFI.fd'').write_bytes(b)

        PY

        '
    - name: Fetch Mu-Silicium for the boot image tools
      run: 'mkdir uefi && cd uefi

        git init -q

        git remote add origin https://github.com/Project-Silicium/Mu-Silicium.git

        git fetch -q --depth 1 origin "$MU_COMMIT"

        git checkout -q FETCH_HEAD

        cd ..

        cp -a overlay/BootShim/. uefi/BootShim/

        cp -a overlay/Resources/. uefi/Resources/

        test -f uefi/Resources/Scripts/mkbootimg.py

        '
    - name: Adapt the pinned upstreams
      run: 'python3 overlay/scripts/adapt.py --unixnu unixnu

        python3 overlay/diagnostics/apply_lmipro_user_trace_flags.py unixnu

        '
    - name: Apply the reviewed official entry diagnostic and qualify firmware
      run: 'git -C lmipro apply --check "$GITHUB_WORKSPACE/overlay/diagnostics/lmi-green-entry.patch"

        git -C lmipro apply "$GITHUB_WORKSPACE/overlay/diagnostics/lmi-green-entry.patch"

        python3 - <<''PY''

        from pathlib import Path

        import hashlib,tomllib

        fd=next(Path(''artifact'').rglob(''SILICIUM_UEFI.fd''))

        assert fd.stat().st_size==0x300000

        assert hashlib.sha256(fd.read_bytes()).hexdigest()==''f95578af73b83c818ab07dc2210e0a435cbb4c9a9a962de3405d5da05921624b''

        b=tomllib.loads(Path(''lmipro/board.toml'').read_text())

        assert b[''payload''][''panic_screen''] and not b[''payload''].get(''entry_probe_reset_delay'')

        PY

        python3 - <<''PY''

        from pathlib import Path

        import tomllib

        p=tomllib.loads(Path(''lmipro/board.toml'').read_text())[''payload'']

        assert ''entry_probe_reset_after'' not in p

        assert ''entry_probe_reset_in'' not in p and ''entry_probe_reset_occurrence'' not in p

        PY

        python3 - <<''PY''

        from pathlib import Path

        import tomllib

        b=tomllib.loads(Path(''lmipro/board.toml'').read_text())

        assert any(x.startswith(''lmipro-ufs-'') for x in b[''payload''][''kernel_args''])

        s=Path(''lmipro/configs/lmipro_defconfig'').read_text()

        assert ''CONFIG_XNU_DT_PANIC_REGION=y'' in s and ''CONFIG_XNU_SHENG_PMGR=y'' in s

        PY

        python3 unixnu/scripts/porting-record.py check --device lmipro

        '
    - name: Resolve the device configuration
      run: 'cd unixnu

        ./unixnu defconfig lmipro_defconfig -D ../lmipro

        # The kernel patch series references kits/XnuPrelink, which only exists

        # after the feeds and submodules are fetched.

        ./unixnu fetch -D ../lmipro

        ./unixnu status -D ../lmipro


        cd "$GITHUB_WORKSPACE/unixnu"

        ./unixnu ipsw fetch -D ../lmipro KernelCache


        ./unixnu tree -D ../lmipro

        python3 scripts/porting-record.py check --device ../lmipro

        '
    - name: Download the exact host-tested Data seed
      uses: actions/download-artifact@v4
      with:
        name: lmi-volatile-data
        run-id: 42480654190
        github-token: ${{ github.token }}
        path: data-import
    - name: Verify and install pinned volatile Data input
      run: 'python3 - <<''PY''

        from pathlib import Path

        import hashlib,json,shutil

        source=Path(''data-import/output'');out=Path(''output'');out.mkdir(exist_ok=True)

        d=json.loads((source/''data-seed.json'').read_text());b=(source/''data-seed/data-32.dbr'').read_bytes()

        assert hashlib.sha256(b).hexdigest()==d[''packed_sha256'']==''2434ed1fdfc09f518fd6b18e6ef77ea94aff5090ed98a8d29018dc013cb42c13''

        assert d[''sha256'']==''8e9ff98f62a4dfc5f8e82ef30f435cfe035ab9830fac59210f8f6a67a5ef097c''

        assert d[''volume_uuid'']==''32EC6E37-C75B-4305-AA27-C2FEA4E67F30'' and d[''bytes'']==33554432

        assert d[''host_timezone_write_probe''] and not d[''persistent'']

        (out/''data-seed'').mkdir(exist_ok=True);(out/''data-seed/data-32.dbr'').write_bytes(b)

        p=Path(''lmipro/patches/xnu/lmipro-data-mount.patch'').read_bytes()

        assert d[''volume_uuid''].encode() in p and b''_REQUIRED'' not in p

        d[''rendered_patch_sha256'']=hashlib.sha256(p).hexdigest()

        (out/''data-seed.json'').write_text(json.dumps(d,indent=2)+''\n'')

        (out/''rendered-lmipro-data-mount.patch'').write_bytes(p)

        print(json.dumps(d,indent=2))

        PY

        '
    - name: Record immutable source revisions for the kernel cache
      id: source-revisions
      run: 'echo "unixnu_sha=$(git -C unixnu rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        echo "device_sha=$(git -C lmipro rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        echo "config_sha=$(shasum -a 256 unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro/.config | cut -d''
        '' -f1)" >> "$GITHUB_OUTPUT"

        '
    - name: Restore the built kernel
      id: kernel-cache
      uses: actions/cache/restore@v4
      with:
        path: unixnu/out/lmipro/*/lmipro/kernel
        key: mount-recovery-v1-lmi-kernel-pmgr-v4-${{ steps.source-revisions.outputs.unixnu_sha }}-${{ steps.source-revisions.outputs.device_sha
          }}-${{ steps.source-revisions.outputs.config_sha }}-0x8011
    - name: Select flag-off reference only on a source cache miss
      run: 'python3 - <<''PY''

        from pathlib import Path

        p=Path(''lmipro/configs/lmipro_defconfig'');s=p.read_text()

        assert s.count(''CONFIG_XNU_SHENG_PMGR=y'')==1

        Path(''declared-lmipro_defconfig'').write_text(s)

        p.write_text(s.replace(''CONFIG_XNU_SHENG_PMGR=y'',''# CONFIG_XNU_SHENG_PMGR is not set'').replace(''CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y'',''#
        CONFIG_XNU_NATIVE_LEGACY_DISPLAY is not set''))

        PY

        cd unixnu

        ./unixnu defconfig lmipro_defconfig -D ../lmipro

        ./unixnu status -D ../lmipro

        '
      if: steps.kernel-cache.outputs.cache-hit != 'true'
    - name: Check volatile persistence refusal
      run: 'cc -std=c11 -O2 -Wall -Wextra -Werror lmipro/package/LmiproVolatileStore.c lmipro/tests/test_lmipro_volatile_store.c
        -o /tmp/lmipro-volatile-store

        /tmp/lmipro-volatile-store

        '
    - name: Test LMIPRO watchdog lifecycle
      run: python3 lmipro/tests/watchdog/run.py
    - name: Check board Data snapshot semantics
      run: 'c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_data_watch.cpp -o /tmp/lmipro-data-watch

        /tmp/lmipro-data-watch


        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_user_trace.cpp -o /tmp/lmipro-user-trace

        /tmp/lmipro-user-trace


        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_sign_progress.cpp -o /tmp/lmipro-sign-progress

        /tmp/lmipro-sign-progress


        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_display_watch.cpp -o /tmp/lmipro-display-watch

        /tmp/lmipro-display-watch


        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_display_policy.cpp -o /tmp/lmipro-display-policy

        /tmp/lmipro-display-policy


        c++ -std=c++17 -DLMIPRO_DISPLAY_BOARD=1 -Wall -Wextra -Werror lmipro/tests/test_lmipro_display_watch.cpp
        -o /tmp/lmipro-display-board-watch

        /tmp/lmipro-display-board-watch


        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_display_trace.cpp -o /tmp/lmipro-display-trace

        /tmp/lmipro-display-trace


        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_ui_trace.cpp -o /tmp/lmipro-ui-trace

        /tmp/lmipro-ui-trace


        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_mode_policy.cpp -o /tmp/lmipro-mode-policy

        /tmp/lmipro-mode-policy


        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_scanout_policy.cpp -o /tmp/lmipro-scanout-policy

        /tmp/lmipro-scanout-policy

        '
    - name: Check exact scoped RAM Data ownership helper
      run: python3 lmipro/tests/test_lmipro_data_owners.py
    - name: Check bounded current-thread UI stack sampling
      run: 'c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_ui_stacks.cpp -o /tmp/lmipro-ui-stacks

        /tmp/lmipro-ui-stacks

        c++ -std=c++17 -Wall -Wextra -Werror lmipro/tests/test_lmipro_ui_exit.cpp -o /tmp/lmipro-ui-exit

        /tmp/lmipro-ui-exit

        '
    - name: Build the fresh flag-off reference candidate
      run: 'cd unixnu

        ./unixnu build kernel -D ../lmipro

        '
      if: steps.kernel-cache.outputs.cache-hit != 'true'
    - name: Audit this job reference against the pinned original cache
      run: 'python3 overlay/diagnostics/prepare_lmipro_pmgr_reference.py --work unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro
        --cache unixnu/out/ipsw/21H461/kernelcache.decompressed --out output

        '
      if: steps.kernel-cache.outputs.cache-hit != 'true'
    - name: Restore declared configuration and link the PMGR integration
      run: 'cp declared-lmipro_defconfig lmipro/configs/lmipro_defconfig

        cd unixnu

        ./unixnu defconfig lmipro_defconfig -D ../lmipro

        ./unixnu status --json -D ../lmipro > ../output/resolved-status.json

        ./unixnu build kernel -D ../lmipro

        '
      if: steps.kernel-cache.outputs.cache-hit != 'true'
    - name: Verify actual PMGR link and original executable contracts
      run: 'python3 overlay/diagnostics/verify_lmipro_pmgr_kernel.py --work unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro
        --out output --device-revision "$DEVICE_REF"

        '
      if: steps.kernel-cache.outputs.cache-hit != 'true'
    - name: Preserve actual DT-panic compile evidence alongside its kernel
      if: steps.kernel-cache.outputs.cache-hit != 'true'
      run: 'python3 - <<''PY''

        from pathlib import Path

        import hashlib,json

        root=Path(''unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro'')

        records=list((root/''tree/build/xnu/ios-obj'').rglob(''pe_init.o.json''));assert len(records)==1

        record=json.loads(records[0].read_text().strip().rstrip('',''))

        flag_in_record=any(''-DXNU_DT_PANIC_REGION=1'' in value for value in record[''arguments''])

        mode=(root/''tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/.dt-panic-region-mode'').read_text().strip()

        assert mode==''1''

        source=Path(record[''file''])

        if not source.is_absolute():source=Path(record[''directory''])/source

        text=source.read_text()

        assert ''#if defined(PLATFORM_PANIC_LOG_PADDR) && !(defined(XNU_DT_PANIC_REGION) && XNU_DT_PANIC_REGION)''
        in text

        report=dict(record=record,per_file_flag_in_compile_record=flag_in_record,dt_panic_build_mode=mode,source_text=text,source_sha256=hashlib.sha256(source.read_bytes()).hexdigest(),kernel_sha256=hashlib.sha256((root/''kernel/kernel.macho'').read_bytes()).hexdigest())

        (root/''kernel/dt-panic-inputs.json'').write_text(json.dumps(report,indent=2))

        PY

        '
    - name: Preserve PMGR build evidence with the exact source kernel
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport shutil\np=Path('unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro/kernel/pmgr-proof');p.mkdir(exist_ok=True)\n\
        for f in ['kernel-build-proof.json','pmgr-archive-proof.json','reference-inputs.json','reference-amfi-pmgr-audit.json','final-amfi-pmgr-audit.json','pmgr-hook-disassembly.txt','ufs-handoff-build-proof.json']:\n\
        \    shutil.copyfile(Path('output')/f,p/f)\nPY\n"
      if: steps.kernel-cache.outputs.cache-hit != 'true'
    - name: Preserve the qualified source kernel before payload diagnostics
      uses: actions/cache/save@v4
      if: steps.kernel-cache.outputs.cache-hit != 'true'
      with:
        path: unixnu/out/lmipro/*/lmipro/kernel
        key: mount-recovery-v1-${{ steps.kernel-cache.outputs.cache-primary-key }}
    - name: Load and qualify PMGR evidence before constructing the payload
      run: 'python3 - <<''PY''

        from pathlib import Path

        import hashlib,json,os,shutil

        root=Path(''unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro'');out=Path(''output'');out.mkdir(exist_ok=True)

        for p in (root/''kernel/pmgr-proof'').iterdir():shutil.copyfile(p,out/p.name)

        proof=json.loads((out/''kernel-build-proof.json'').read_text())

        assert proof[''device_revision'']==os.environ[''DEVICE_REF'']

        assert proof[''unixnu_revision'']==os.environ[''UNIXNU_REF'']

        assert proof[''kernel_sha256'']==hashlib.sha256((root/''kernel/kernel.macho'').read_bytes()).hexdigest()

        assert proof[''pmgr_mode_compiled'']==proof[''dt_panic_mode_compiled'']==1 and proof[''pmgr_virtual_entries'']==340

        assert proof[''bsd_hook_verified''] and proof[''original_amfi_and_pmgr_executables_verified_unchanged'']

        assert proof[''functional_power_backend''] is False

        PY

        '
    - name: Build the trust cache bundle
      run: "cd unixnu\n# Extract the two modules the payload trust cache carries. The board has\n# no [ipsw]\
        \ fetch list, so name them explicitly.\n./unixnu ipsw fetch -D ../lmipro StaticTrustCache \"Cryptex1,SystemTrustCache\"\
        \ KernelCache\n# The extracted files are named after the IPSW members (044-...dmg.trustcache),\n# so\
        \ pair them by the component recorded in the sidecar JSON.\nstatic=$(grep -l '\"component\": \"StaticTrustCache\"\
        ' out/ipsw/*/*.json | head -1)\nsystem=$(grep -l '\"component\": \"Cryptex1,SystemTrustCache\"' out/ipsw/*/*.json\
        \ | head -1)\nstatic=${static%.json}\nsystem=${system%.json}\necho \"static: $static\"\necho \"system:\
        \ $system\"\ntest -f \"$static\" && test -f \"$system\"\npython3 ../overlay/scripts/build-trust-bundle.py\
        \ \\\n  --static \"$static\" \\\n  --system \"$system\" \\\n  --output trust.bundle \\\n  --report\
        \ trust.json\ncat trust.json\n"
    - name: Check exact canonical CPU pixel copy
      run: 'c++ -std=c++17 -Wall -Wextra -Werror -I unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro/tree/drivers/GopFramebuffer
        lmipro/tests/test_lmipro_cpu_pixels.cpp -o /tmp/lmipro-cpu-pixels

        /tmp/lmipro-cpu-pixels

        '
    - name: Build the payload
      env:
        UNIXNU_UNIQUE_CHIP_ID: '0x8011'
      run: "cd unixnu\n# panic_screen needs FrameBufferSerialPortLib/Font.h from Mu-Silicium.\n./unixnu build\
        \ payload -D ../lmipro \\\n  --unique-chip-id \"$UNIXNU_UNIQUE_CHIP_ID\" \\\n  --uefi ../uefi \\\n\
        \  --trust-cache trust.bundle \\\n  --kernel-arg amfi=0x4 \\\n  --data-ramdisk ../output/data-seed/data-32.dbr\
        \ \\\n  --kernel-arg lmipro-system-watchdog=1 \\\n  --kernel-arg lmipro-data-watch=120 \\\n  --kernel-arg\
        \ lmipro-display-watch=2 \\\n  --kernel-arg lmipro-display-init=1 \\\n  --kernel-arg offline-legacy-phase=4\
        \ \\\n  --kernel-arg offline-legacy-register=1 \\\n  --kernel-arg offline-legacy-gop=1 \\\n  --kernel-arg\
        \ lmipro-display-calls=1 \\\n  --kernel-arg lmipro-ui-stacks=1 \\\n  --kernel-arg lmipro-ui-watch=1\
        \ \\\n  --kernel-arg lmipro-display-mode=1 \\\n  --kernel-arg lmipro-display-cpu=1 \\\n  --kernel-arg\
        \ offline-legacy-pm=1 \\\n  --kernel-arg offline-legacy-validate=1 \\\n  --kernel-arg offline-legacy-transfer=1\
        \ \\\n  --kernel-arg offline-legacy-cpu-present=1\n"
    - name: Pack the boot image with the payload in the kernel
      run: "fd=$(find artifact -name 'SILICIUM_UEFI.fd' | head -1)\ntest -n \"$fd\" || { echo 'the firmware\
        \ artifact is missing the FD'; exit 1; }\npayload=$(find unixnu/out -name 'payload.img' | head -1)\n\
        test -n \"$payload\" || { echo 'no payload volume produced'; exit 1; }\nout=unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro/boot/boot.img\n\
        python3 overlay/scripts/pack_bootimg.py \\\n  --uefi uefi \\\n  --fd \"$fd\" \\\n  --payload \"$payload\"\
        \ \\\n  --dtb overlay/DeviceTree/lmi.dtb \\\n  --payload-base 0x93200000 \\\n  --out \"$out\"\nls -l\
        \ \"$out\"\n"
    - name: Verify actual payload probe installation and collect inputs
      run: python3 overlay/diagnostics/verify_green_payload.py
    - name: Verify linked watchdog and package evidence
      run: 'set -euo pipefail

        root=unixnu/out/lmipro/ipados-17.7.11-21H461/lmipro

        llvm-nm -n "$root/kernel/kernel.macho" > watchdog-symbols.txt

        grep -E '' [TtS] _lmipro_ram_watchdog_prepare$'' watchdog-symbols.txt

        python3 - <<''PY''

        import json,pathlib

        out=pathlib.Path(''output'')

        args=json.loads((out/''payload.json'').read_text())[''kernel_args''].split()

        assert args.count(''lmipro-system-watchdog=1'')==1

        PY

        cp "$root/tree/build/lmipro-watchdog/watchdog-build.json" output/watchdog-build.json'
    - name: Upload the boot image with the payload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lmi-ui-exit-stacks
        path: 'output/boot.img

          output/boot.json

          output/payload.json

          output/verification.json

          output/mount-recovery-proof.json

          output/test-board.toml

          output/kernel.config

          output/SILICIUM_UEFI.fd

          output/firmware.dtb

          output/payload-patch.log

          output/SHA256SUMS

          unixnu/out/**/logs/*.log

          output/dt-panic-compile-proof.json


          output/kernel-original.macho

          output/kernel-build-proof.json

          output/pmgr-archive-proof.json

          output/reference-inputs.json

          output/reference-amfi-pmgr-audit.json

          output/final-amfi-pmgr-audit.json

          output/pmgr-hook-disassembly.txt

          output/ufs-handoff-build-proof.json


          output/data-seed.json

          output/rendered-lmipro-data-mount.patch

          output/data-seed/data-32.dbr

          output/ram-block-bindings.json


          unixnu/out/**/tree/build/ram-block/lmipro-bindings.json

          unixnu/out/**/tree/build/ram-block/LmiproVolatileStore.o


          output/data-watch-proof.json

          unixnu/out/**/tree/build/lmipro-ufs-block/build-proof.json


          unixnu/out/**/tree/build/pmgr-reference/lmipro-reference.macho

          unixnu/out/**/tree/build/pmgr-reference/lmipro-reference.json


          output/userspace-checkpoint-proof.json

          output/rendered-lmipro-userspace-checkpoint.patch

          output/pid1-trace-proof.json

          output/rendered-lmipro-pid1-trace.patch

          unixnu/build/lmipro-user-trace-flags.json

          unixnu/out/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/sleh.o.json

          unixnu/out/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT/systemcalls.o.json


          output/sign-progress-proof.json

          output/rendered-lmipro-filesig-stage.patch

          output/original-native-4k-signature-hash-cache.patch

          unixnu/out/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT/kern_descrip.o.json


          output/display-watch-proof.json

          output/LmiproDisplayWatch.h


          output/display-init-build.json

          output/display-init-abi.json

          output/display-init-archive.a

          output/display-init-compile.json

          output/display-init-proof.json

          output/LmiproDisplay.cpp

          output/LmiproDisplayPolicy.h


          output/display-dispatch-proof.json

          output/LmiproDisplayTrace.h

          output/rendered-lmipro-display-dispatch.patch

          unixnu/out/**/tree/build/native-legacy-display/build-report.json

          unixnu/out/**/tree/build/native-legacy-display/libNativeLegacyDisplay.late.a

          unixnu/out/**/tree/build/native-legacy-display/board-compile-command.json

          unixnu/out/**/tree/build/display-analysis/mobile-graphics-legacy-abi.json

          unixnu/out/**/tree/build/xnu/ios-obj/**/IOUserClient.cpo.json


          output/ui-activity-proof.json

          output/LmiproUITrace.h

          output/LmiproUserTrace.h


          output/display-mode-proof.json

          output/LmiproModePolicy.h

          output/rendered-lmipro-ui-fault-registers.patch


          output/display-cpu-proof.json

          output/LmiproScanoutPolicy.h


          output/display-submit-proof.json

