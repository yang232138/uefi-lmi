name: LMIPRO original UFS error log
on:
  push:
    branches: [test/lmipro-ufs-log-20261103]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  firmware:
    # EDK II builds with clang + lld on Linux. The kernel step needs macOS, so
    # this job stops at the firmware volume and the boot image.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNIXNU_REPO: yang232138/UniXNU
      UNIXNU_REF: ee472385743ebd16941ab14892dcb9d02e219d15
      DEVICE_REPO: yang232138/lmipro
      DEVICE_REF: fa4f4acf5830f94e17b4492944356e5d424f2a53
      MU_COMMIT: e51cd877e31c8fbb322032dc4cb6715e83d25ad3
    steps:
      - name: Check out this overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Check out UniXNU
        run: mkdir unixnu && cd unixnu && git init -q && git remote add origin "https://github.com/$UNIXNU_REPO" && git fetch -q --depth 1 origin "$UNIXNU_REF" && git checkout -q FETCH_HEAD

      - name: Check out the device repository
        run: mkdir lmipro && cd lmipro && git init -q && git remote add origin "https://github.com/$DEVICE_REPO" && git fetch -q --depth 1 origin "$DEVICE_REF" && git checkout -q FETCH_HEAD

      - name: Fetch Mu-Silicium at the pinned commit
        run: |
          mkdir uefi && cd uefi
          git init -q
          git remote add origin https://github.com/Project-Silicium/Mu-Silicium.git
          git fetch -q --depth 1 origin "$MU_COMMIT"
          git checkout -q FETCH_HEAD
          # The shared EDK II tree and Mu packages. Binaries is skipped on purpose:
          # the board vendor DXE set comes from this repository instead.
          git submodule update --init --depth 1 \
            Mu_Basecore Common/Mu Common/Mu_OEM_Sample Silicium-ACPI || true
          test -d Mu_Basecore/BaseTools || { echo 'Mu_Basecore is not checked out'; exit 1; }

      - name: Install the host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm nasm uuid-dev python3 make \
            acpica-tools device-tree-compiler unzip mtools gcc
          clang --version | head -1
          python3 --version

      - name: Execute the AArch64 handoff checks
        run: |
          python3 -m venv handoff-test
          handoff-test/bin/pip install unicorn==2.1.4
          handoff-test/bin/python overlay/scripts/test_boot_handoff.py

      - name: Stage the board overlay and the vendor DXE set
        run: |
          cp -a overlay/Platforms/. uefi/Platforms/
          cp -a overlay/BootShim/. uefi/BootShim/
          cp -a overlay/Resources/. uefi/Resources/
          rm -rf uefi/Binaries/lmi
          mkdir -p uefi/Binaries/lmi
          unzip -q overlay/Binaries-lmi.zip -d uefi/Binaries/lmi
          test -f uefi/Platforms/Xiaomi/lmiPkg/lmi.dsc
          test -f uefi/Binaries/lmi/QcomPkg/Drivers/ButtonsDxe/ButtonsDxe.inf
          echo "vendor DXE files: $(find uefi/Binaries/lmi -type f | wc -l)"

      - name: Adapt the pinned upstreams
        # bootimg's image_size check, and the SEC entry-argument handoff that
        # Project-Silicium v4.0 drops: without it the DAEE82E6 HOB is never
        # built, UniXNURamDiskDxe never publishes the payload volume, and the
        # menu has no xnu entry. String edits instead of a patch file so the
        # checkout's line endings do not matter.
        run: python3 overlay/scripts/adapt.py --unixnu unixnu --uefi uefi

      - name: Resolve the device configuration
        run: |
          cd unixnu
          ./unixnu defconfig lmipro_defconfig -D ../lmipro
          ./unixnu fetch -D ../lmipro
          ./unixnu status -D ../lmipro

      - name: Adapt the resolved shared edk2 feed
        run: |
          edk2=$(find unixnu/out/feeds -maxdepth 1 -type d -name 'mu_basecore-*' | head -1)
          test -n "$edk2"
          test "$(git -C "$edk2" rev-parse HEAD)" = cfb93724a06ff86ff5ba971413368a7809ee42a5
          python3 overlay/scripts/adapt.py --unixnu unixnu --edk2 "$edk2"

      - name: Test bounded trace and instrument the resolved DXE Core
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror overlay/diagnostics/ufs-dispatch/test_trace.c -o trace-test
          ./trace-test
          edk2=$(find unixnu/out/feeds -maxdepth 1 -type d -name 'mu_basecore-*' | head -1)
          python3 overlay/diagnostics/ufs-dispatch/instrument.py --edk2 "$edk2" --uefi uefi | tee instrumentation.json

      - name: Build the firmware volume
        run: |
          cd unixnu
          ./unixnu build firmware -D ../lmipro --uefi ../uefi
          fd=$(find ../uefi/Build/lmiPkg -path '*FV/SILICIUM_UEFI.fd' | head -1)
          test -n "$fd" || { echo 'no firmware volume produced'; exit 1; }
          echo "firmware volume: $fd ($(stat -c %s "$fd") bytes)"

      - name: Verify compiled diagnostic footer
        run: |
          cpu=$(find uefi/Build/lmiPkg -path '*/AARCH64/ArmCpuDxe.efi' | head -1)
          test -n "$cpu"
          python3 -c 'import pathlib,sys; assert b"LMI-MMU-HOB-PAYLOAD" in pathlib.Path(sys.argv[1]).read_bytes(), "Diagnostic footer missing from compiled CPU driver"' "$cpu"
          python3 -c 'import pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes(); assert b"LMI-GCD4 CAP" in b and b"LMI-GCD4 OUT rawstatus=" in b, "GCD trace missing from compiled CPU driver"' "$cpu"

      - name: Verify MMU helper producer and consumer
        run: |
          sec=$(find uefi/Build/lmiPkg -path '*/AARCH64/Sec.efi' | head -1)
          cpu=$(find uefi/Build/lmiPkg -path '*/AARCH64/ArmCpuDxe.efi' | head -1)
          python3 -c 'import pathlib,sys; assert b"LMI-MMU-HOB publish helper=" in pathlib.Path(sys.argv[1]).read_bytes(); assert b"LMI-MMU-HOB use=" in pathlib.Path(sys.argv[2]).read_bytes()' "$sec" "$cpu"

      - name: Build result viewer and pack independently checked image
        run: |
          python3 -m venv verify-tools
          verify-tools/bin/pip install uefi_firmware==1.16
          verify-tools/bin/python overlay/diagnostics/ufs-dispatch/package.py

      - name: Upload diagnostic image and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmipro-ufs-original-error-log
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/
            unixnu/out/**/logs/*.log
            instrumentation.json
