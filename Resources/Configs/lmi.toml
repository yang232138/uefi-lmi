# Mu-Silicium device configuration for the Redmi K30 Pro (lmi, SM8250).
#
# The FD base and size are the historical lmi values (0x9fc00000, 3 MiB) recorded by
# the public lmi UEFI overlay and its MemoryMapLib "UEFI FD" entry. They are compile
# inputs for BootShim and are checked against the built FD by unixnu bootimg.
# They are not a measurement on this handset: confirm them from the phone's own
# bootloader memory map before flashing.

[boot_shim]
requires_kernel_header = true

[uefi_fd]
base = 0x9FC00000
size = 0x300000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = true

[boot_image]
# Header v1, like the other Mu-Silicium boards on this SoC (alioth, cepheus,
# kebab). The device tree is appended to the kernel field (append_dtb), so the
# ABL must not be told to load a separate dtb: a v2 header with dtb_size 0 fails
# at load time ("Failed to load/authenticate boot image: Load Error").
# kernel_addr 0x8000, ramdisk_addr 0x1000000, tags_addr 0x100, page 4096.
header_version = 1
base = 0x00000000
kernel_offset = 0x00008000
# ramdisk_addr = DDR base (0x80000000) + this, and lmiPkg's MemoryMapLib reserves
# the matching 64 MiB at 0x93200000 so the payload stays inside the MMU map.
ramdisk_offset = 0x13200000
tags_offset = 0x00000100
pagesize = 4096
